<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧农业监测系统 - 登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-brand">
                <h1>🌾 智慧农业监测系统</h1>
                <p>智能农场全环境监测平台</p>
            </div>
            
            <div class="auth-form">
                <h2>欢迎登录</h2>
                
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
                </div>
                
                <div class="form-group captcha-group">
                    <label for="captcha">验证码</label>
                    <div class="captcha-row">
                        <input type="text" id="captcha" placeholder="请输入验证码" maxlength="4">
                        <img id="captchaImage" src="{{ url_for('auth.captcha') }}?t=0" alt="验证码" onclick="refreshCaptcha()">
                        <button type="button" class="captcha-refresh" onclick="refreshCaptcha()" title="刷新验证码">↻</button>
                    </div>
                </div>
                
                <button class="auth-btn" id="loginBtn">登 录</button>
                
                <div class="auth-links">
                    <span>还没有账号？</span>
                    <a href="{{ url_for('auth.register_page') }}">立即注册</a>
                </div>
            </div>
            
            <div class="auth-footer">
                <p>智慧农业监测系统 v1.2.6</p>
            </div>
        </div>
        
        <div class="auth-bg-decoration"></div>
    </div>
    
    <div id="toastContainer" class="toast-container"></div>
    
    <script>
        window.captchaUrl = "{{ url_for('auth.captcha') }}";
        window.loginUrl = "{{ url_for('auth.login') }}";
        window.dashboardUrl = "{{ url_for('views.dashboard') }}";
    </script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
